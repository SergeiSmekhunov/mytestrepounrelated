name: 116117 check

on:
  schedule:
    # Each run checks every 2 min for ~13 min, so late/skipped cron starts don't leave gaps.
    # Off the full hour on purpose: GitHub's busiest (and most delayed) slot. 
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

concurrency:
  group: check-116117
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Remembers what was last alerted so you get one email per new slot list,
      # not one every 5 minutes.
      - uses: actions/cache/restore@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check appointments
        env:
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          fail=0
          end=$((SECONDS + 780))
          while :; do
            python check.py || fail=1
            [ "$SECONDS" -ge "$end" ] && break
            sleep 120
          done
          exit $fail

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: state-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshot
          path: screenshot.png
          retention-days: 3
